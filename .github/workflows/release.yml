# =============================================================================
#  release.yml - Publicar una versión de Luma (GitHub Actions)
# =============================================================================
#  Se ejecuta SOLO cuando subes una etiqueta "v...", por ejemplo:
#      git tag v0.2.0
#      git push origin v0.2.0
#
#  En los servidores de GitHub (gratis en repos públicos):
#    1. Comprueba que la etiqueta coincida con client/core/version.h.
#    2. Compila Luma.dll y LumaLauncher.exe (oficial: se actualiza solo).
#    3. Arma latest.json (versión, huella del .exe, notas, versiones de
#       Minecraft) y lo FIRMA con la clave privada guardada en el secreto
#       LUMA_SIGNING_KEY (nunca está en el código).
#    4. Crea la Release con LumaLauncher.exe, latest.json y latest.json.sig.
#  El launcher instalado baja esos dos archivos chicos al abrir y, si hay una
#  versión nueva con firma válida, se actualiza solo.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # para poder crear la Release

jobs:
  release:
    runs-on: windows-2022  # trae Visual Studio 2022, el que usan los presets
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la versión
        run: python scripts/release.py check-version "${{ github.ref_name }}"

      - name: Configurar (compilación oficial)
        run: cmake --preset x64 -DLUMA_OFFICIAL_BUILD=ON

      - name: Compilar
        run: cmake --build --preset release

      - name: Armar latest.json
        run: python scripts/release.py manifest --tag "${{ github.ref_name }}" --exe build/bin/Release/LumaLauncher.exe --out dist

      - name: Firmar
        shell: bash
        env:
          LUMA_SIGNING_KEY: ${{ secrets.LUMA_SIGNING_KEY }}
        run: |
          if [ -z "$LUMA_SIGNING_KEY" ]; then echo "Falta el secreto LUMA_SIGNING_KEY"; exit 1; fi
          printf '%s\n' "$LUMA_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/latest.json.der" dist/latest.json
          rm -f "$RUNNER_TEMP/key.pem"
          python scripts/release.py der2raw "$RUNNER_TEMP/latest.json.der" dist/latest.json.sig

      - name: Publicar la Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/LumaLauncher.exe dist/latest.json dist/latest.json.sig \
            --title "Luma ${{ github.ref_name }}" --notes-file dist/notes.md
