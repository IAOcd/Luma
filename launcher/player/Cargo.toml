[package]
name = "luma-spotify"
version = "0.1.0"
edition = "2021"
description = "Luma's own Spotify player (a Spotify Connect device named Luma, built on librespot)"
publish = false

[dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["rodio-backend", "native-tls"] }
librespot-oauth = { version = "0.8.0", default-features = false, features = ["native-tls"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
